name: probe (temporary)
on:
  push:
    branches: [claude/project-thread-cnkarc]
    paths: [scripts/probe/**, .github/workflows/probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: node scripts/probe/probe.mjs

name: CI

on:
  pull_request:
  push:
    branches: [main]
  # fetch-sightings.yml が自動取得のPR（claude/auto-sightings）を作ったあとに起動する
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: 型チェック
        run: npm run typecheck
      - name: テスト
        run: npm test
      - name: ビルド（データ検証を含む）
        run: npm run build

  # claude で始まるブランチのPRは、CIが通ったらそのままマージして本番に反映する。
  # 自動取得のPR（claude/auto-sightings）は workflow_dispatch で起動されるので、そのときもマージする。
  # GITHUB_TOKEN によるマージでは push トリガーのワークフローが起動しないため、
  # マージ後に deploy.yml を workflow_dispatch で明示的に起動する（workflow_dispatch は GITHUB_TOKEN でも起動できる）。
  merge-and-deploy:
    needs: test
    if: >-
      (github.event_name == 'pull_request' &&
      startsWith(github.head_ref, 'claude') &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref_name == 'claude/auto-sightings')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: マージ
        run: |
          if [ -z "$PR_URL" ]; then
            PR_URL=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json url --jq '.[0].url // empty')
            if [ -z "$PR_URL" ]; then echo "このブランチのPRがありません"; exit 1; fi
          fi
          gh pr merge --squash --delete-branch --match-head-commit "$HEAD_SHA" "$PR_URL"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: デプロイを起動
        run: gh workflow run deploy.yml --repo "$REPO" --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
